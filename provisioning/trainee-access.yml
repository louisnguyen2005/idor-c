---
# Tạo tài khoản đội bằng mật khẩu cấu hình sẵn trong group_vars/all.yml,
# khóa tài khoản kali mặc định, và bật SSH bằng password cho các tài khoản đội.
- name: Xác nhận tài khoản quản trị tách biệt với tài khoản thí sinh
  ansible.builtin.assert:
    that:
      - ansible_user is defined
      - ansible_user not in ['kali', 'team1', 'team2', 'team3']
    fail_msg: "Dùng tài khoản quản trị của image (ví dụ debian); playbook này giữ nguyên tài khoản đó."

- name: Yêu cầu đủ mật khẩu cho ba đội trong group_vars
  ansible.builtin.assert:
    that:
      - meko_team_passwords is mapping
      - meko_team_passwords.keys() | list | sort == ['team1', 'team2', 'team3']
      - meko_team_passwords[inventory_hostname] | default('') | length >= 8
    fail_msg: "Cấu hình meko_team_passwords cho team1/team2/team3 (mỗi mật khẩu từ 8 ký tự) trong group_vars/all.yml."
  no_log: true

- name: Cài gói phục vụ tài khoản và SSH
  ansible.builtin.apt:
    name: [python3, openssh-server, passwd]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Tạo tài khoản đội cho console và SSH
  ansible.builtin.user:
    name: "{{ inventory_hostname }}"
    group: users
    shell: /bin/bash
    create_home: true
    password_lock: false
  register: meko_team_user

- name: Đặt mật khẩu cấu hình sẵn cho tài khoản đội
  ansible.builtin.command:
    argv: [/usr/sbin/chpasswd]
    stdin: "{{ inventory_hostname }}:{{ meko_team_passwords[inventory_hostname] }}"
  changed_when: true
  no_log: true

- name: Phát hiện tài khoản kali mặc định của image
  ansible.builtin.getent:
    database: passwd
    key: kali
    fail_key: false

- name: Khóa và vô hiệu hóa tài khoản kali mặc định
  ansible.builtin.user:
    name: kali
    password_lock: true
    shell: /usr/sbin/nologin
  when: ansible_facts.getent_passwd.get('kali') is not none

- name: Đảm bảo thư mục drop-in của sshd tồn tại
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Nạp drop-in trước cấu hình mặc định của image
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: 'Include /etc/ssh/sshd_config.d/*.conf'
    insertbefore: BOF
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Reload SSH

- name: Bật SSH bằng password cho các tài khoản đội
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/90-meko-trainee.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Meko Boutique: SSH bằng password cho tài khoản đội.
      Match User team1,team2,team3
          PasswordAuthentication yes
          PubkeyAuthentication yes
          KbdInteractiveAuthentication no
          PermitEmptyPasswords no
      Match all
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Reload SSH

- name: Ghi danh sách địa chỉ lab cho thí sinh
  ansible.builtin.copy:
    dest: "/home/{{ inventory_hostname }}/lab-addresses.txt"
    owner: "{{ inventory_hostname }}"
    group: users
    mode: '0644'
    content: |
      Meko Boutique — địa chỉ lab
      Máy của bạn: {{ inventory_hostname }} ({{ meko_addresses[inventory_hostname] }})
      Team 1: http://10.90.0.11/
      Team 2: http://10.90.0.12/
      Team 3: http://10.90.0.13/
      Các đội truy cập HTTP chéo nhau để tấn công. Đăng nhập SSH bằng mật khẩu tài khoản đội.
