# Lab-only credentials and per-team secrets.
# Replace before use outside an isolated training cloud.
#
# Per team (team_secrets[host]):
#   password         -> web portal login (student / <password>)
#   console_password -> topology console login for user teamNN (teamNN / <console_password>)
#   ssh_user         -> the ONLY account allowed over SSH on that box (mekoNN)
#   ssh_password     -> password for ssh_user; SSH always prompts for it
#   flag             -> hidden behind the IDOR.
# The console account (teamNN) is blocked from SSH, so SSH requires the mekoNN
# credential, separate from the console credential.
lab_enforce_owner: false

lab_hosts:
  team01: 10.80.0.11
  team02: 10.80.0.12
  team03: 10.80.0.13
  team04: 10.80.0.14
  checker: 10.80.0.30

lab_teams:
  team01: 10.80.0.11
  team02: 10.80.0.12
  team03: 10.80.0.13
  team04: 10.80.0.14

# team -> flag, consumed by the checker/flag-validator on the `checker` server.
# Keep in sync with team_secrets[*].flag below.
